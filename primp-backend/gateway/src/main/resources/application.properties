spring.application.name=gateway
server.port=${GATEWAY_PORT}

# Downstream service URLs
user.service.url=${USER_SERVICE_URL}
booking.service.url=${BOOKING_SERVICE_URL}
review.service.url=${REVIEW_SERVICE_URL}
notification.service.url=${NOTIFICATION_SERVICE_URL}

# JWT
jwt.secret=${JWT_SECRET}

# Shared secret proving a request actually came through this gateway — every
# downstream service rejects requests missing/mismatching this header, so
# they can only be reached via the gateway, not by hitting their ports directly.
internal.service.secret=${INTERNAL_SERVICE_SECRET}