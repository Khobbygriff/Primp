spring.application.name=notification-service
server.port=${NOTIFICATION_SERVICE_PORT}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${NOTIFICATION_DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT — must match the secret used by the User Service / Gateway that issues tokens
jwt.secret=${JWT_SECRET}

# Shared secret proving a request came through the gateway; rejects any
# request that hits this service's port directly without it. Note this
# service's own /api/notifications/internal endpoint (used by booking-service
# to create notifications) is itself only reachable this way now too, since
# every downstream-to-downstream call still needs to be updated to send this
# header if service-to-service calls bypass the gateway (see NotificationClient
# in booking-service).
internal.service.secret=${INTERNAL_SERVICE_SECRET}