spring.application.name=user-service
server.port=${USER_SERVICE_PORT}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${USER_DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Downstream service URLs
notification.service.url=${NOTIFICATION_SERVICE_URL}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
jwt.secret=${JWT_SECRET}

# Shared secret proving a request came through the gateway; rejects any
# request that hits this service's port directly without it.
internal.service.secret=${INTERNAL_SERVICE_SECRET}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Paystack
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.public-key=${PAYSTACK_PUBLIC_KEY}