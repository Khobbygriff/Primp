spring.application.name=review-service
server.port=${REVIEW_SERVICE_PORT}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${REVIEW_DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT — must match the secret used by the User Service / Gateway that issues tokens
jwt.secret=${JWT_SECRET}

# Shared secret proving a request came through the gateway; rejects any
# request that hits this service's port directly without it.
internal.service.secret=${INTERNAL_SERVICE_SECRET}