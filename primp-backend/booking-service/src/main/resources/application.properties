spring.application.name=booking-service
server.port=${BOOKING_SERVICE_PORT}

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${BOOKING_DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Notification Service
notification.service.url=${NOTIFICATION_SERVICE_URL}

# User Service (used to resolve names for receipts and check premium flags)
user.service.url=${USER_SERVICE_URL}

# JWT — must match the secret used by the User Service / Gateway that issues tokens
jwt.secret=${JWT_SECRET}

# Shared secret proving a request came through the gateway; rejects any
# request that hits this service's port directly without it.
internal.service.secret=${INTERNAL_SERVICE_SECRET}

# Paystack
paystack.secret-key=${PAYSTACK_SECRET_KEY}
paystack.public-key=${PAYSTACK_PUBLIC_KEY}